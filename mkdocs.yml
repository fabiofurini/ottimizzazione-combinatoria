# mkdocs.yml template (English): generated by genera_sito.py with LINGUA=en.
# Do not edit mkdocs.yml by hand.
site_name: Ottimizzazione combinatoria · Fabio Furini
site_url: https://fabiofurini.github.io/ottimizzazione-combinatoria/
site_description: >-
  Le dispense di ottimizzazione combinatoria: zaino, bin packing, colorazione, commesso viaggiatore, scheduling su macchine parallele e lot sizing, risolti in tutti i modi: formulazioni e loro proprietà, programmazione dinamica, algoritmi euristici e di approssimazione, algoritmi specializzati.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/ottimizzazione-combinatoria
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/ottimizzazione-combinatoria/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/dots-grid
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
plugins:
  - search:
      lang: en

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/operations-research-lab/
      name: Operations Research Lab
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/linear-programming/
      name: Linear Programming
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
    - icon: material/math-integral
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/linear-algebra/
      name: Linear Algebra
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/convex-optimization/
      name: Convex Optimization
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algorithms/
      name: Algorithms
  alternate:
    - name: English
      link: https://fabiofurini.github.io/combinatorial-optimization/
      lang: en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js


nav:
  - Home: index.md
