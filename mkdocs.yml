extra_css:
  - stylesheets/extra.css?v=a25c6f8414
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=c51ac2286b

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: In questa pagina
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=2f2f0d6685
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
