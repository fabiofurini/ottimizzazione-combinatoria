# Modello di mkdocs.yml (italiano): lo usa genera_sito.py, che scrive mkdocs.yml.
# Non modificare mkdocs.yml a mano.
site_name: Ottimizzazione combinatoria · Fabio Furini
site_description: >-
  Dispense di ottimizzazione combinatoria: problemi di zaino, di packing, di colorazione, di cricca, di routing, di scheduling e di lot sizing, risolti in tutti i modi: formulazioni e loro proprietà, programmazione dinamica, algoritmi euristici, di approssimazione e ad hoc, con esercizi e notebook Colab.
site_author: Fabio Furini
site_url: https://fabiofurini.github.io/ottimizzazione-combinatoria/
repo_url: https://github.com/fabiofurini/ottimizzazione-combinatoria
copyright: >-
  &copy; 2026 Fabio Furini — testi e figure con licenza
  <a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>,
  codice con licenza
  <a href="https://github.com/fabiofurini/ottimizzazione-combinatoria/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: it
  icon:
    logo: material/dots-grid
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /laboratorio/*.md
  !/laboratorio/index.md

plugins:
  - search:
      lang: it

